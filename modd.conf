cmd/**/*.go
internal/**/*.go
plugins/**/*.go
templx/**/*.go
pkg/**/*.go
internal/**/*.yml
# Les assets sont embarqués dans le binaire (go:embed) : sans reconstruction,
# une modification de JS n'atteint jamais le navigateur.
#
# La sortie de vite est exclue : elle vit sous internal/, et `build-frontend` la
# réécrit à chaque construction — surveillée, elle relancerait la construction
# qui vient de la produire, en boucle.
internal/**/*.js
!internal/http/handler/webui/pipeline/assets/dist/**
misc/tailwind/templui.css
.env
Makefile
modd.conf {
  prep: "make -o generate build-server all-plugins"
  daemon: "make CMD='bin/server' run-with-env"
}

internal/**/*.templ
templx/**/*.templ {
  prep: make build-server
}

# L'éditeur de pipeline est reconstruit à la demande, pas à chaque changement Go :
# `build-frontend` passe par `npm ci`, qui efface et réinstalle node_modules. Sa
# sortie est suivie par git, donc le binaire embarque la version commitée tant
# que personne ne touche à ces sources.
frontend/src/**/*.ts
frontend/src/**/*.tsx
frontend/src/**/*.css {
  # +noinit : pas de reconstruction au démarrage de modd, seulement quand ces
  # sources changent. La sortie commitée est déjà à jour.
  prep +noinit: make build-frontend
}

pkg/pluginsdk/proto/*.proto {
  prep: "make generate-proto"
}
